apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-routing-config
  namespace: scavenger
data:
  routing-rules.yaml: |
    primary_region: us-east-1
    secondary_region: us-east-2
    routing_strategy: failover
    failover_conditions:
      - metric: health_check_failures
        threshold: 3
        window: 60s
      - metric: error_rate
        threshold: 5
        window: 300s
      - metric: latency_p99
        threshold: 2000
        window: 300s
    stickiness:
      enabled: true
      cookie_name: scavenger-region
      cookie_ttl: 86400
    geo_routing:
      enabled: true
      default_region: us-east-1
      region_mappings:
        - name: North America
          regions: [us-east-1, us-east-2]
          primary: us-east-1
        - name: Europe
          regions: [eu-west-1, eu-central-1]
          primary: eu-west-1
        - name: Asia Pacific
          regions: [ap-southeast-1, ap-northeast-1]
          primary: ap-southeast-1

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cross-region-traffic
  namespace: scavenger
spec:
  podSelector:
    matchLabels:
      app: scavenger
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8
    - ipBlock:
        cidr: 172.16.0.0/12
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 443
  egress:
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80
    - protocol: UDP
      port: 53
