groups:
  - name: capacity_alerts
    interval: 30s
    rules:
      - alert: HighCPUUtilization
        expr: avg by (cluster_name) (ecs_cpu_utilization{environment="prod"}) > 70
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "ECS CPU utilization above 70%"
          description: "CPU utilization is {{ $value }}% (threshold 70%)"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: CriticalCPUUtilization
        expr: avg by (cluster_name) (ecs_cpu_utilization{environment="prod"}) > 85
        for: 3m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "ECS CPU utilization above 85%"
          description: "CPU utilization is {{ $value }}% (threshold 85%)"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: HighMemoryUtilization
        expr: avg by (cluster_name) (ecs_memory_utilization{environment="prod"}) > 75
        for: 5m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "ECS memory utilization above 75%"
          description: "Memory utilization is {{ $value }}% (threshold 75%)"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: CriticalMemoryUtilization
        expr: avg by (cluster_name) (ecs_memory_utilization{environment="prod"}) > 90
        for: 3m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "ECS memory utilization above 90%"
          description: "Memory utilization is {{ $value }}% (threshold 90%)"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: HighRDSStorage
        expr: (rds_free_storage_bytes{environment="prod"} / rds_allocated_storage_bytes{environment="prod"}) * 100 < 20
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "RDS free storage below 20%"
          description: "RDS free storage is {{ $value }}% of allocated"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: CriticalRDSStorage
        expr: (rds_free_storage_bytes{environment="prod"} / rds_allocated_storage_bytes{environment="prod"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
          team: devops
        annotations:
          summary: "RDS free storage below 10%"
          description: "RDS free storage is {{ $value }}% of allocated"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: HighALBRequestRate
        expr: rate(alb_request_count{environment="prod"}[5m]) > 8000
        for: 10m
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "ALB request rate above 8000 req/s"
          description: "Request rate is {{ $value }} req/s"
          runbook: "docs/CAPACITY_PLANNING.md"

      - alert: CapacityForecastWarning
        expr: predict_linear(ecs_cpu_utilization{environment="prod"}[7d], 86400) > 80
        for: 1h
        labels:
          severity: warning
          team: devops
        annotations:
          summary: "Capacity forecast predicts >=80% CPU in 24h"
          description: "Predicted CPU utilization in 24h: {{ $value }}%"
          runbook: "docs/CAPACITY_PLANNING.md"
